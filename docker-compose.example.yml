services:
  web:
    build: .
    command: ["node", "server.js"]
    env_file: .env
    environment:
      CATWORLD_UPLOAD_DIR: /data/uploads
    ports: ["8088:3000"]
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  worker-uploads:
    build: .
    command: ["./node_modules/.bin/tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      CATWORLD_UPLOAD_DIR: /data/uploads
      CATWORLD_WORKER_ID: worker-uploads
      CATWORLD_WORKER_JOB_TYPES: "PREVIEW_UPLOAD,IMPORT_UPLOAD"
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    # Camada 2 (auditoria): le a pulsacao geral que o worker grava no banco a
    # cada ~15s (independente de job especifico — ver src/worker/metrics.ts).
    # Se travar de verdade (nao so um job), o Coolify reinicia sozinho.
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  worker-sync:
    build: .
    command: ["./node_modules/.bin/tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      CATWORLD_UPLOAD_DIR: /data/uploads
      CATWORLD_WORKER_ID: worker-sync
      CATWORLD_WORKER_JOB_TYPES: "SOURCE_REFRESH,DERIVED_REFRESH"
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  uploads:
