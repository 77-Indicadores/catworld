name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: catworld, POSTGRES_PASSWORD: catworld_ci, POSTGRES_DB: catworld }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catworld -d catworld"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CATWORLD_DATABASE_URL: "postgres://catworld:catworld_ci@localhost:5432/catworld"
      # Postgres DESCARTAVEL (o do proprio CI) para os testes *.pg.test.ts — nunca aponte para producao.
      CW_TEST_PG_URL: "postgres://catworld:catworld_ci@localhost:5432/postgres"
      CATWORLD_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      AUTH_SECRET: "ci-auth-secret-with-more-than-thirty-two-bytes"
      AUTH_URL: "http://127.0.0.1:3000"
      CATWORLD_UPLOAD_DIR: "./var/uploads"
      CATWORLD_ADMIN_EMAIL: admin@example.com
      CATWORLD_ADMIN_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e